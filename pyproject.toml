[project]
name = "wikialigner"
version = "0.2.0"
description = "Desktop tool for locating translated sentences across Wikipedia language editions and revisions."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "Apache-2.0" }
authors = [
  { name = "Zhilu Tu" },
  { name = "Minghao Wang" },
  { name = "Mark Shuttleworth" },
  { name = "Zhiwen Hua" },
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "pysbd>=0.3.4",
  "numpy>=1.26",
  "sentence-transformers>=3.0",
  "openpyxl>=3.1",
  "platformdirs>=4.0",
  "python-docx>=1.1",
  "pywebview>=5.0",
]

[project.scripts]
wikialigner = "wikialigner.desktop:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]
build = ["pyinstaller>=6.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wikialigner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
